name: Validate patch scripts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test family detection, refusal cases and ASLR
        shell: powershell
        run: ./tests/Test-WPSPro.ps1
      - name: Test ordinary and international NSIS extraction and patching
        shell: powershell
        run: ./tests/Test-WPSStandard.ps1
